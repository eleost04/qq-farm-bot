name: build-arm64

on:
  schedule:
    # 03:00 Asia/Shanghai, ahead of the 04:00 check on the router
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if this upstream commit already has an image
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  actions: write

env:
  UPSTREAM: liyangpengs/qq-farm-bot
  IMAGE: ghcr.io/${{ github.repository_owner }}/qq-farm-bot

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Keep the schedule from being auto-disabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/build-arm64.yml/enable"

      - name: Sync fork master
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/merge-upstream" -f branch=master

      - name: Resolve upstream commit
        id: upstream
        run: |
          sha=$(git ls-remote "https://github.com/$UPSTREAM.git" refs/heads/master | cut -f1)
          [ -n "$sha" ]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Upstream commit: $sha" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Check for an existing image
        id: check
        env:
          SHA: ${{ steps.upstream.outputs.sha }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" != "true" ] && docker manifest inspect "$IMAGE:$SHA" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Image already exists, nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ steps.upstream.outputs.sha }}

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.skip != 'true'

      - name: Build
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: core/Dockerfile
          platforms: linux/arm64
          load: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.upstream.outputs.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.upstream.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        if: steps.check.outputs.skip != 'true'
        env:
          SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          docker run -d --name smoke -p 127.0.0.1:3007:3007 -e NODE_ENV=production -e ADMIN_PORT=3007 "$IMAGE:$SHA"
          for i in $(seq 1 30); do
            if curl -fsS -m 3 http://127.0.0.1:3007/api/game-version | tee /tmp/version.json | grep -q '"ok":true'; then
              cat /tmp/version.json >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 2
          done
          docker logs smoke
          exit 1

      - name: Push
        if: steps.check.outputs.skip != 'true'
        env:
          SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:latest"
